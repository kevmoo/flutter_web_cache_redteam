name: redteam_harness
description: >-
  Empirical browser-caching stress tests for Flutter web `--web-content-hash`:
  builds the sample app, simulates hosting policies and deploy strategies,
  and drives Chromium over CDP to observe what users actually get.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  http: ^1.6.0
  path: ^1.9.1
  shelf: ^1.4.2
  webkit_inspection_protocol: ^1.2.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
